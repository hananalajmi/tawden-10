  --chamfer:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1530;font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c.grab{cursor:grabbing}

/* Controls borrow the chamfered navy tag from the poster */
.plate{
  position:relative;border:0;padding:0;background:linear-gradient(180deg,#f6f8fb,#aab4c4 48%,#eef1f6);
  clip-path:var(--chamfer);cursor:pointer;color:#fff;font:800 1rem/1 Tajawal,sans-serif;
  filter:drop-shadow(0 0 14px rgba(59,155,255,.55));
  transition:filter .18s
}
.plate>span{
  display:flex;align-items:center;justify-content:center;gap:.5em;margin:2.5px;
  background:linear-gradient(180deg,#1149b4,var(--navy) 55%,var(--navy-deep));
  clip-path:var(--chamfer);padding:.72em 1.9em .62em;white-space:nowrap
}
.plate:hover{filter:drop-shadow(0 0 22px rgba(90,175,255,.95))}
.plate:active>span{background:var(--navy-deep)}
.plate:focus-visible{outline:none;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 0 16px #fff)}

#open{position:fixed;left:50%;bottom:max(2.2vh,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:clamp(1.05rem,2.5vh,1.5rem)}
#open svg{width:1.05em;height:1.05em}
#rotate{display:none;position:fixed;left:0;right:0;bottom:calc(max(2.2vh,env(safe-area-inset-bottom)) + 70px);text-align:center;font-weight:500;font-size:.95rem;color:var(--ink)}
@media (orientation:portrait) and (max-width:700px){body[data-mode=idle] #rotate,body[data-mode=lab] #rotate{display:block;visibility:visible}}

#sound{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:46px;height:46px;font-size:0}
#sound>span{padding:0;height:calc(100% - 5px);width:calc(100% - 5px)}
#sound svg{width:22px;height:22px}
#sound.off .on,#sound:not(.off) .mute{display:none}

#back{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));font-size:.98rem}
#back>span{padding:.66em 1.5em .56em}
#ngss{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(72px,calc(env(safe-area-inset-left) + 72px));font-size:.98rem}
#ngss>span{padding:.6em 1.2em .5em;gap:.45em}




/* Invisible until pointed at: the hexagons themselves are painted in the picture */
#spots{position:fixed;inset:0;pointer-events:none;visibility:hidden}
body[data-mode=lab] #spots{visibility:visible}
#spots button{position:absolute;pointer-events:auto;border:0;padding:0;background:transparent;cursor:pointer;clip-path:polygon(23% 0,77% 0,100% 50%,77% 100%,23% 100%,0 50%);transition:background .15s}
#spots button.hx{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.28em;padding-top:.2em;color:#fff;font:800 1em/1.05 Tajawal,sans-serif}
.hxIc{display:block;width:2.6em;height:2.6em;filter:drop-shadow(0 0 .22em rgba(90,200,255,.95))}
.hxIc svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hxT{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.98em;white-space:nowrap;text-shadow:0 0 .3em rgba(80,180,255,.95),0 .05em .1em rgba(0,10,40,.8)}
.hxT.two{font-size:.88em;gap:.12em}
.hxT.two~*{display:none}
#spots button.hx:has(.two) .hxIc{width:2.2em;height:2.2em}
#spots button:hover{background:rgba(120,200,255,.28)}
#spots button:active{background:rgba(255,255,255,.4)}
#spots button:focus-visible{outline:none;background:rgba(255,255,255,.42)}
#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);max-width:min(78vw,34em);text-align:center;font-weight:500;line-height:1.45;padding:.6em 1.2em .5em;background:rgba(7,28,79,.92);border-radius:3px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:640px){#toast{top:72px}}
body[data-mode=lab] #sound{bottom:auto;top:max(14px,env(safe-area-inset-top))}


/* Library: the room's navy and steel, with the books as the only bright thing */
#lib{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0,#17408f,#0a1f55 55%,#061338);overflow:auto;-webkit-overflow-scrolling:touch}
#lib[hidden],#reader[hidden],#libScene[hidden]{display:none}
#libScene{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0,#17408f,#0a1f55 55%,#061338)}
#lsc{position:absolute;left:50%;top:50%;width:1672px;height:941px;transform-origin:center;overflow:hidden;color:#fff}
#lscBg{position:absolute;inset:0;width:100%;height:100%;display:block}
#lscHint{position:absolute;left:170px;top:14px;margin:0;padding:.42em 1em .3em;font-size:25px;font-weight:800;background:rgba(9,28,82,.88);border-radius:6px;transition:background .2s}
#lscHint.warn{background:#a8222f}
#closeLib{position:absolute;right:20px;top:10px;font-size:22px;z-index:9}
#dim{position:absolute;inset:0;background:rgba(5,14,44,.72);opacity:0;pointer-events:none;transition:opacity .7s;z-index:2}
#lsc.open #dim{opacity:1}
#fb .spine span{writing-mode:vertical-rl;white-space:nowrap}
#fb .onShelf{position:absolute;inset:0}
#fb .onShelf span{position:absolute;left:0;right:0;top:44%;height:14%;display:flex;align-items:center;justify-content:center;white-space:nowrap;font:800 52px Tajawal,sans-serif;color:#10264f;background:linear-gradient(180deg,#f5dc97,#d3a648 60%,#b98a30)}
.gapImg{position:absolute;visibility:hidden}
.shelfBook{position:absolute;padding:0;border:0;background:none;cursor:pointer;z-index:1}
.shelfBook .band{position:absolute;display:flex;align-items:center;justify-content:center;white-space:nowrap;font:800 24px Tajawal,sans-serif;color:#10264f;background:linear-gradient(180deg,#f5dc97,#d3a648 60%,#b98a30);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.shelfBook svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.shelfBook polygon{fill:rgba(255,255,255,0);stroke:#ffd97a;stroke-width:3;stroke-linejoin:round;opacity:.8;transition:fill .15s,opacity .15s}
.shelfBook:hover polygon,.shelfBook:focus-visible polygon{fill:rgba(255,255,255,.14);stroke-width:5;opacity:1}
.shelfBook:focus-visible{outline:none}
.shelfBook.out{visibility:hidden}
#closeLib{position:absolute;right:20px;top:10px;font-size:22px;z-index:9}
#lsc.open #lscHint,#lsc.open #closeLib{display:none}
#fly{position:absolute;inset:0;perspective:2000px;pointer-events:none;z-index:4}
#fb{position:absolute;left:0;top:0;width:440px;height:566px;transform-style:preserve-3d;will-change:transform}
#fb[hidden]{display:none}
#fb .f{position:absolute;backface-visibility:hidden}
#fb .front,#fb .back{inset:0}
#fb .front{transform:translateZ(66px);box-shadow:0 0 34px rgba(255,214,120,.55)}
#fb .front img{width:100%;height:100%;display:block}
#fb .back{transform:rotateY(180deg) translateZ(66px);background:#10264f}
#fb .spine{left:154px;top:0;width:132px;height:566px;transform:rotateY(90deg) translateZ(220px);display:flex;align-items:center;justify-content:center;font:800 58px Tajawal,sans-serif}
#fb .edge{left:154px;top:0;width:132px;height:566px;transform:rotateY(-90deg) translateZ(220px);background:repeating-linear-gradient(90deg,#f6f7fa 0 3px,#d6dbe4 3px 5px)}
#fb .top,#fb .bot{left:0;top:217px;width:440px;height:132px;background:repeating-linear-gradient(0deg,#f6f7fa 0 3px,#d6dbe4 3px 5px)}
#fb .top{transform:rotateX(90deg) translateZ(283px)}
#fb .bot{transform:rotateX(-90deg) translateZ(283px)}
#bk{position:absolute;left:207px;top:10px;width:1258px;height:810px;perspective:2600px;transform-origin:50% 50%;z-index:5;filter:drop-shadow(0 16px 30px rgba(0,0,0,.55))}
#bk[hidden],#bkTools[hidden]{display:none}
#bk .pg{position:absolute;top:0;width:629px;height:810px;background:#fff;overflow:hidden}
#bk .pg img,#leaf img{width:100%;height:100%;display:block}
#bk .pg img[src=""],#leaf img[src=""]{visibility:hidden}
#bk .L{left:0}#bk .R{left:629px}
#bk .L::after,#bk .R::after,.lf::after{content:'';position:absolute;inset:0;pointer-events:none}
#bk .L::after,.lf.fr::after{background:linear-gradient(270deg,rgba(20,30,60,.3),transparent 7%)}
#bk .R::after,.lf.bk2::after{background:linear-gradient(90deg,rgba(20,30,60,.3),transparent 7%)}
#leaf{position:absolute;left:0;top:0;width:629px;height:810px;transform-origin:100% 50%;transform-style:preserve-3d;display:none;z-index:2}
.lf{position:absolute;inset:0;backface-visibility:hidden;background:#fff;overflow:hidden}
.lf.bk2{transform:rotateY(180deg)}
.bkHit{position:absolute;top:0;width:50%;height:100%;background:none;border:0;padding:0;cursor:pointer;z-index:3}
#hitNext{left:0}#hitPrev{left:50%}
.bkHit:focus-visible{outline:3px solid #7fd6ff;outline-offset:-4px}
#bkTools{position:absolute;left:0;right:0;top:826px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px}
#bkTools .r1,#bkTools .r2{display:flex;align-items:center;gap:12px}
#bkTools .plate{font-size:21px}
#bkTools .plate>span{padding:.5em 1.1em .4em}
#bkTools .plate[disabled]{opacity:.4;pointer-events:none}
#bkLabel{min-width:220px;text-align:center;font-size:24px;font-weight:800}
#bkTabs .plate{font-size:19px}
#bkTabs .plate>span{padding:.5em .9em .4em}
#bkIndex{font:500 19px Tajawal,sans-serif;width:330px;padding:.4em .5em .3em;color:#0b2765;background:#eef2f8;border:0;border-radius:4px}
#bkGo{display:flex;align-items:center;gap:.4em;font-size:20px;font-weight:800}
#bkGo input{width:84px;font:800 20px Tajawal,sans-serif;text-align:center;padding:.3em .2em .2em;color:#0b2765;background:#eef2f8;border:0;border-radius:4px}
#bkIndex:focus-visible,#bkGo input:focus-visible{outline:3px solid #7fd6ff}
@media (prefers-reduced-motion:reduce){.shelfBook polygon,#dim{transition:none}}
#shelfView{min-height:100%;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px 28px}
.libbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.libbar h1{margin:0;font-size:clamp(1.3rem,3.2vw,2.2rem);font-weight:800}
.libbar .plate{font-size:.98rem;flex:none}
.libbar .plate>span{padding:.66em 1.5em .56em}
#shelf{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;align-content:center;gap:clamp(18px,4vw,56px);padding:24px 0}
.book{width:clamp(150px,22vw,290px);border:0;background:none;color:#fff;font:inherit;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.35em;transition:transform .16s}
.book img{width:100%;aspect-ratio:.78;object-fit:cover;object-position:left top;display:block;margin-bottom:.5em;box-shadow:0 0 0 2px rgba(255,255,255,.75),0 12px 34px rgba(0,0,0,.5),0 0 26px rgba(70,160,255,.35)}
.book strong{font-size:clamp(1rem,1.5vw,1.25rem);line-height:1.25}
.book span{font-weight:500;font-size:.92rem;color:#c8d9f5}
.book:hover{transform:translateY(-5px)}
.book:focus-visible{outline:3px solid #fff;outline-offset:6px}
#reader{position:fixed;inset:0;display:flex;flex-direction:column;background:#071233}
#reader .libbar{padding:max(8px,env(safe-area-inset-top)) 10px 8px;background:#0b245f}
#bookTitle{font-weight:800;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#stage{flex:1;min-height:0;overflow:hidden;display:flex;touch-action:pan-y pinch-zoom}
#stage.zoomed{overflow:auto;touch-action:auto}
#pages{margin:auto;display:flex;gap:4px;padding:6px;flex:none}
#pages img{display:block;background:#fff;max-width:none;user-select:none;-webkit-user-select:none}
#tools{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,18px);padding:8px 10px max(8px,env(safe-area-inset-bottom));background:#0b245f;flex-wrap:wrap}
#tools .plate{font-size:.95rem}
#tools .plate>span{padding:.62em 1.3em .52em}
#tools .plate:disabled{opacity:.4;cursor:default;filter:none}
#tools .sq>span{padding:.5em .95em .4em;font-size:1.2rem}
#tools label{display:flex;align-items:center;gap:.4em;font-weight:500}
#pageNum{width:4.2em;font:800 1rem Tajawal,sans-serif;text-align:center;border:0;border-radius:3px;padding:.3em .2em .2em;color:var(--ink);background:#eef2f8}
#pageNum:focus-visible{outline:3px solid var(--glow)}
@media (max-width:520px){#tools .plate>span{padding:.6em 1em .5em}}


/* Experiments: a 1672x941 sheet in picture pixels, scaled to the screen */
#exp{position:fixed;inset:0;background:#0a1a44;overflow:hidden}
#exp[hidden]{display:none}
@media (orientation:portrait){#exp::after{content:'أدر الجهاز بالعرض لترى التجربة أكبر';position:absolute;left:0;right:0;bottom:8%;text-align:center;font-weight:800;color:#fff}}
#expStage{position:absolute;left:50%;top:50%;width:1672px;height:941px;transform-origin:center;overflow:hidden;background:#0a1f55;font-family:Tajawal,sans-serif;color:#fff}
#expStage .bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#expStage .corner,#expHud .corner{position:absolute;left:14px;top:10px;font-size:1.25rem;z-index:6}
#expHud{position:absolute;left:50%;top:50%;width:1672px;height:941px;transform-origin:center;pointer-events:none;font-family:Tajawal,sans-serif;color:#fff}
#expHud>*{pointer-events:auto}
#expStage.camon{overflow:visible}
.rescover{position:absolute;left:0;top:572px;width:1672px;height:228px;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(150,162,186,.0),#8f9db9 6%,#7f8dac 94%,rgba(130,145,175,.0))}
.waste{position:absolute;left:1025px;top:420px;width:100px;height:88px;z-index:3;pointer-events:none}
.waste svg{position:absolute;inset:0;width:100%;height:100%}
.waste i{position:absolute;left:11px;right:11px;bottom:3px;height:0;display:block;background:rgba(125,185,240,.5);border-top:2px solid rgba(240,250,255,.95);border-radius:0 0 7px 7px;transition:height .7s ease}
.wipe{position:absolute;top:330px;width:48px;height:34px;z-index:6;pointer-events:none;background:linear-gradient(180deg,#fff,#dfe5ee);border-radius:7px 10px 6px 12px;box-shadow:0 2px 5px rgba(10,25,60,.4)}
.topext{position:absolute;left:0;top:-170px;width:1672px;height:170px;display:block;pointer-events:none}
.funnel{position:absolute;left:745px;top:-95px;width:92px;height:95px;z-index:3;pointer-events:none}
.funnel svg{display:block;width:100%;height:100%}
.pourjet{position:absolute;left:772px;top:-98px;width:7px;height:62px;z-index:6;border-radius:4px;display:none;background:linear-gradient(90deg,rgba(150,210,255,.75),#eef8ff,rgba(150,210,255,.75));pointer-events:none}
.pourjet.on{display:block}
.burliq{position:absolute;left:769px;bottom:723px;width:45px;height:0;z-index:2;border-radius:0 0 18px 18px;pointer-events:none;background:linear-gradient(90deg,rgba(105,175,240,.6),rgba(170,215,250,.42) 50%,rgba(105,175,240,.6));border-top:2px solid rgba(240,250,255,.95)}
.b2liq{position:absolute;left:20px;bottom:61px;width:117px;height:0;background:linear-gradient(180deg,rgba(150,205,250,.5),rgba(90,160,235,.42));border-top:2px solid rgba(235,247,255,.95);border-radius:0 0 8px 8px}
.bliq{position:absolute;left:5px;right:5px;top:6px;bottom:6px;overflow:hidden;border-radius:18px;pointer-events:none}
.bliq i{position:absolute;left:-100%;width:300%;height:400%;display:block;transform-origin:50% 0;background:rgba(125,190,248,.34);border-top:2.5px solid rgba(240,250,255,.95);transition:top .9s linear}
.tag.small{font-size:11px;padding:.2em .45em .1em;border-width:1px;border-radius:3px;z-index:8}
.chooser #expStage{background:radial-gradient(120% 90% at 50% 0,#17408f,#0a1f55 55%,#061338)}
.choose{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.choose h1{margin:0;font-size:58px;font-weight:800}
.cards{display:flex;gap:48px}
.card{width:680px;border:0;padding:0 0 22px;background:linear-gradient(180deg,#eef3fb,#cdd8ea);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 34px rgba(70,160,255,.6);transition:transform .15s}
.card img{width:100%;height:330px;object-fit:cover;object-position:top;display:block;margin-bottom:10px}
.card em{font-style:normal;font-weight:800;font-size:24px;background:var(--navy);color:#fff;padding:.3em 1em .2em;border-radius:4px}
.card strong{font-size:36px;font-weight:800}
.card span{font-size:21px;font-weight:500;color:#30456f}
.card:hover{transform:translateY(-6px)}
.card:focus-visible{outline:5px solid #fff;outline-offset:6px}
.stepglow{position:absolute;pointer-events:none;border-radius:14px;transition:box-shadow .25s,background .25s}
.stepglow.on{box-shadow:0 0 0 4px #5fc4ff,0 0 26px 8px rgba(70,170,255,.85);background:rgba(120,200,255,.12)}
.stepglow i{position:absolute;left:18%;top:-12px;width:32px;height:32px;display:none}
.stepglow i svg{width:100%;height:100%}
.stepglow.done i{display:block}
.lcd{direction:ltr;position:absolute;display:flex;align-items:baseline;justify-content:center;gap:.12em;padding-top:.08em;background:#a9d1e6;color:#0e1b2c;font-family:"Segoe UI",Arial,sans-serif;font-style:italic;font-weight:700;line-height:1.3;border-radius:4px;box-shadow:inset 0 0 12px rgba(40,90,130,.35)}
.lcd small{font-size:.42em;font-style:normal;font-weight:700}
.lcd.bal{background:#14243f;color:#86d6ff;font-style:normal;align-items:center;box-shadow:none}
.lcd.bal.pop{color:#c8f0ff;text-shadow:0 0 9px #58c0ff}
.lcd.mini{left:auto;right:6%;top:24%;width:27%;height:27%;font-size:33px}
.micro{position:absolute;left:340px;top:36px;width:1010px;height:610px;z-index:9;display:flex;background:linear-gradient(160deg,#16356f,#0a1b48);border-radius:26px;box-shadow:0 0 0 3px #bfe6ff,0 0 34px 8px rgba(70,170,255,.75);overflow:hidden;transform-origin:-200px 330px;animation:microIn .55s cubic-bezier(.2,.8,.25,1)}
.micro.mB{transform-origin:-100px 330px}
@keyframes microIn{from{transform:scale(.08);opacity:0}}
.mview{flex:none;width:620px;height:100%;background:radial-gradient(circle at 50% 45%,#2c5297,#0c1f50 72%);cursor:grab}
.mview canvas{display:block;width:100%;height:100%}
.micro.msol{transform-origin:50% 60%}
.micro.msol .mview{cursor:default}
.micro.msol .mside p{font-size:24px}
.mview:active{cursor:grabbing}
.mside{flex:1;min-width:0;padding:26px 28px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.mside em{font-style:normal;font-weight:800;font-size:24px;background:#1148b0;padding:.25em .9em .15em;border-radius:6px}
.micro.mB .mside em{background:#8f1b52}
.mside h2{margin:0;font-size:35px;font-weight:800;line-height:1.2;direction:rtl}
.mside p{margin:0;font-size:25px;font-weight:500;line-height:1.45}
.mside ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:25px;font-weight:800}
.mside li{display:flex;align-items:center;gap:12px}
.mside li i{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 2px #fff;flex:none}
.mside small{font-size:20px;font-weight:500;color:#c5d8f7}
.mside .plate{margin-top:auto;font-size:1.5rem;align-self:center}
.tool{position:absolute;transform-origin:center;pointer-events:none;will-change:transform}
.tool img{display:block;width:100%;height:100%}
.rodclip{position:absolute;overflow:hidden;z-index:5;pointer-events:none}
.jet{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;display:none;filter:drop-shadow(0 0 3px #7fc8ff)}
.jet path{animation:flow .35s linear infinite}
@keyframes flow{to{stroke-dashoffset:-21}}
.dishpow,.spoonpow{position:absolute;opacity:0;transition:opacity .2s;border-radius:50% 50% 8px 8px/90% 90% 10% 10%;background:linear-gradient(180deg,#fff,#d7dce4)}
.dishpow{left:28px;bottom:9px;width:56px;height:20px}
